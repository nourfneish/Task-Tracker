<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg: #eef4fb;
            --surface: #ffffff;
            --surface-alt: #f8fbff;
            --border: #d9e2ec;
            --text: #102a43;
            --muted: #52667a;
            --shadow: 0 20px 45px rgba(15, 23, 42, 0.09);
            --shadow-soft: 0 8px 24px rgba(15, 23, 42, 0.08);
            --danger: #ffe6e6;
            --warning: #fff7db;
            --success: #e7f7ef;
            --primary: #2f6ce5;
            --primary-strong: #1d4ed8;
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top left, rgba(47, 108, 229, 0.12), transparent 24%),
                        radial-gradient(circle at bottom right, rgba(47, 108, 229, 0.08), transparent 22%),
                        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
            color: var(--text);
        }

        img {
            max-width: 100%;
            display: block;
        }

        .app-header {
            padding: 2rem 2.5rem;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(13, 48, 91, 0.08);
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.06);
        }

        .app-header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            max-width: 1480px;
            margin: 0 auto;
        }

        .app-header h1 {
            margin: 0 0 0.35rem;
            font-size: clamp(1.75rem, 2vw, 2.2rem);
            letter-spacing: -0.03em;
        }

        .app-header p {
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
        }

        .new-task-button {
            border: 0;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: #fff;
            padding: 0.85rem 1.2rem;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 700;
            box-shadow: 0 18px 40px rgba(47, 108, 229, 0.18);
            transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
        }

        .new-task-button:hover,
        .new-task-button:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 22px 45px rgba(47, 108, 229, 0.22);
            background: linear-gradient(135deg, #2f6ce5, #1e40af);
            outline: none;
        }

        main {
            padding: 2rem 2.5rem 3rem;
            max-width: 1480px;
            margin: 0 auto;
        }

        .main-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 1.25rem;
            align-items: start;
        }

        .activity-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: var(--shadow-soft);
            position: sticky;
            top: 1rem;
        }

        .activity-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .activity-panel-header h2 {
            margin: 0;
            font-size: 1.05rem;
            color: #152e4d;
        }

        .activity-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .activity-item {
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(217, 226, 236, 0.8);
        }

        .activity-item:last-child {
            border-bottom: 0;
            padding-bottom: 0;
        }

        .activity-item:first-child {
            padding-top: 0;
        }

        .activity-action {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1f3a5f;
        }

        .activity-details {
            margin: 0.25rem 0 0.35rem;
            font-size: 0.88rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .activity-time {
            font-size: 0.8rem;
            color: #6b8299;
        }

        .task-activity-section {
            border-top: 1px solid var(--border);
            padding-top: 1rem;
            margin-top: 0.25rem;
        }

        .task-activity-section h3 {
            margin: 0 0 0.75rem;
            font-size: 0.98rem;
            color: #152e4d;
        }

        .task-activity-section .activity-list {
            max-height: 180px;
            overflow-y: auto;
        }

        .activity-state {
            color: #4f6d8d;
            font-size: 0.9rem;
        }

        .activity-state-error {
            color: #991b1b;
            font-size: 0.9rem;
        }

        .board-area {
            min-width: 0;
        }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-soft);
        }

        .filter-bar input[type="search"],
        .filter-bar select,
        .filter-bar input[type="text"] {
            border: 1px solid rgba(82, 102, 122, 0.15);
            border-radius: 14px;
            padding: 0.55rem 0.85rem;
            font: inherit;
            color: var(--text);
            background: #f9fbff;
            transition: border-color 180ms ease, box-shadow 180ms ease;
        }

        .filter-bar input[type="search"]:focus,
        .filter-bar select:focus,
        .filter-bar input[type="text"]:focus {
            outline: none;
            border-color: rgba(47, 108, 229, 0.37);
            box-shadow: 0 0 0 4px rgba(47, 108, 229, 0.08);
        }

        .filter-search {
            flex: 1 1 180px;
            min-width: 140px;
        }

        .filter-bar select {
            flex: 0 1 auto;
        }

        .filter-clear-button[disabled] {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1.25rem;
            align-items: start;
        }

        .board-column {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            min-height: 312px;
            box-shadow: var(--shadow-soft);
            transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        .board-column:hover {
            transform: translateY(-1px);
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .column-header h2 {
            margin: 0;
            font-size: 1.05rem;
            color: #152e4d;
        }

        .column-count {
            background: #eef4ff;
            color: #3751a9;
            border-radius: 999px;
            padding: 0.35rem 0.7rem;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .task-card {
            background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 18px;
            padding: 1rem;
            margin-bottom: 0.85rem;
            box-shadow: 0 16px 28px rgba(15, 23, 42, 0.06);
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            cursor: grab;
            transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
        }

        .task-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 22px 38px rgba(15, 23, 42, 0.09);
            border-color: rgba(47, 108, 229, 0.2);
        }

        .task-card.is-dragging {
            opacity: 0.7;
            transform: rotate(1deg) scale(1.02);
        }

        .board-column.drag-over {
            border-color: rgba(47, 108, 229, 0.35);
            box-shadow: inset 0 0 0 1px rgba(47, 108, 229, 0.18), 0 18px 30px rgba(47, 108, 229, 0.06);
        }

        .board-feedback {
            grid-column: 1 / -1;
            margin-bottom: 1rem;
            padding: 0.95rem 1rem;
            border-radius: 16px;
            border: 1px solid #f8d7da;
            background: #fff1f2;
            color: #981b1b;
        }

        .task-card h3 {
            margin: 0;
            font-size: 1rem;
            color: #0f2138;
            line-height: 1.4;
        }

        .task-card p {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.92rem;
            color: var(--muted);
            flex-wrap: wrap;
        }

        .priority-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .priority-pill.high {
            background: #ffe3e3;
            color: #b91c1c;
        }

        .priority-pill.medium {
            background: #fff4d6;
            color: #a16207;
        }

        .priority-pill.low {
            background: #dcf9e0;
            color: #166534;
        }

        .board-state {
            grid-column: 1 / -1;
            margin-bottom: 1rem;
            padding: 1rem 1.1rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--surface);
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
        }

        .board-state-loading,
        .board-state-empty {
            color: #4f6d8d;
            background: #f3f7fb;
        }

        .board-state-error {
            color: #991b1b;
            background: #fff1f2;
            border-color: #fccaca;
        }

        .board-state p {
            margin: 0.35rem 0 0;
        }

        .empty-placeholder {
            padding: 1.15rem;
            border-radius: 14px;
            border: 1px dashed rgba(82, 102, 122, 0.24);
            color: #5f7d96;
            background: #f7fafc;
            font-size: 0.95rem;
        }

        .retry-button {
            margin-top: 0.75rem;
            border: 0;
            background: var(--primary);
            color: #fff;
            padding: 0.55rem 0.9rem;
            border-radius: 12px;
            cursor: pointer;
            transition: background 180ms ease, transform 180ms ease;
        }

        .retry-button:hover,
        .retry-button:focus-visible {
            transform: translateY(-1px);
            background: var(--primary-strong);
            outline: none;
        }

        .edit-button {
            border: 1px solid rgba(82, 102, 122, 0.18);
            background: #f8fbff;
            color: #1f3a5f;
            padding: 0.42rem 0.75rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.88rem;
            transition: background 180ms ease, border-color 180ms ease;
        }

        .edit-button:hover {
            background: #eef4ff;
            border-color: rgba(47, 108, 229, 0.2);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal-dialog {
            width: min(100%, 580px);
            max-height: calc(100vh - 2rem);
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            box-shadow: 0 32px 80px rgba(15, 23, 42, 0.14);
            border: 1px solid rgba(13, 48, 91, 0.06);
            padding: 1.35rem;
        }

        .modal-dialog.modal-dialog--compact {
            width: min(100%, 500px);
            padding: 1rem 1.1rem;
        }

        .modal-dialog--compact .modal-header {
            margin-bottom: 0.75rem;
        }

        .modal-dialog--compact .modal-header h2 {
            font-size: 1.05rem;
        }

        .modal-dialog--compact .modal-form {
            gap: 0.75rem;
        }

        .modal-dialog--compact .form-field label {
            font-size: 0.88rem;
        }

        .modal-dialog--compact .form-field input,
        .modal-dialog--compact .form-field select,
        .modal-dialog--compact .form-field textarea {
            padding: 0.65rem 0.85rem;
        }

        .modal-dialog--compact .form-field textarea {
            min-height: 72px;
        }

        .modal-dialog--compact .task-activity-section {
            padding-top: 0.75rem;
            margin-top: 0;
        }

        .modal-dialog--compact .task-activity-section h3 {
            margin-bottom: 0.5rem;
            font-size: 0.92rem;
        }

        .modal-dialog--compact .task-activity-section .activity-list {
            max-height: 110px;
        }

        .modal-dialog--compact .modal-actions {
            margin-top: 0.15rem;
        }

        .modal-dialog--compact .cancel-button,
        .modal-dialog--compact .submit-button {
            padding: 0.7rem 1rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.1rem;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .modal-close {
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-row {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-field label {
            font-weight: 600;
            color: #274155;
            font-size: 0.95rem;
        }

        .form-field input,
        .form-field select,
        .form-field textarea {
            border: 1px solid rgba(82, 102, 122, 0.15);
            border-radius: 14px;
            padding: 0.85rem 1rem;
            font: inherit;
            color: var(--text);
            background: #f9fbff;
            transition: border-color 180ms ease, box-shadow 180ms ease;
        }

        .form-field input:focus,
        .form-field select:focus,
        .form-field textarea:focus {
            outline: none;
            border-color: rgba(47, 108, 229, 0.37);
            box-shadow: 0 0 0 4px rgba(47, 108, 229, 0.08);
        }

        .form-field textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-field input.is-invalid,
        .form-field textarea.is-invalid {
            border-color: #f87171;
            background: #fff2f2;
        }

        .field-error {
            color: #b91c1c;
            font-size: 0.85rem;
        }

        .form-error {
            color: #b91c1c;
            background: #fff1f2;
            border: 1px solid #fecaca;
            padding: 0.85rem 1rem;
            border-radius: 14px;
            font-size: 0.95rem;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.85rem;
            margin-top: 0.4rem;
            flex-wrap: wrap;
        }

        .cancel-button,
        .submit-button {
            border: 0;
            padding: 0.85rem 1.1rem;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
        }

        .cancel-button {
            background: #f3f6fb;
            color: #334155;
            border: 1px solid rgba(82, 102, 122, 0.15);
        }

        .submit-button {
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: #fff;
        }

        .submit-button:hover,
        .submit-button:focus-visible {
            background: linear-gradient(135deg, #2f6ce5, #1e40af);
            outline: none;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }

            .activity-panel {
                position: static;
            }

            .board {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 700px) {
            .board {
                grid-template-columns: 1fr;
            }

            main {
                padding: 1.25rem;
            }

            .app-header {
                padding: 1.25rem 1.25rem 1.5rem;
            }

            .app-header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .task-footer {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>
    <header class="app-header">
        <div class="app-header-content">
            <div>
                <h1>Task Tracker</h1>
                <p>Keep work moving across the board.</p>
            </div>
            <button type="button" id="new-task-button" class="new-task-button">New Task</button>
        </div>
    </header>

    <main>
        <div class="main-layout">
            <div class="board-area">
                <div class="filter-bar" role="search">
                    <input
                        type="search"
                        id="filter-search"
                        class="filter-search"
                        placeholder="Search tasks…"
                        aria-label="Search tasks"
                    />
                    <select id="filter-status" aria-label="Filter by status">
                        <option value="">All statuses</option>
                        <option value="ToDo">To Do</option>
                        <option value="InProgress">In Progress</option>
                        <option value="Done">Done</option>
                    </select>
                    <select id="filter-priority" aria-label="Filter by priority">
                        <option value="">All priorities</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                    <input
                        type="text"
                        id="filter-assignee"
                        placeholder="Assignee"
                        aria-label="Filter by assignee"
                    />
                    <button type="button" id="filter-clear-button" class="edit-button filter-clear-button" disabled>Clear</button>
                </div>
                <section id="board" class="board" aria-live="polite"></section>
            </div>
            <aside id="activity-panel" class="activity-panel" aria-live="polite">
                <div class="activity-panel-header">
                    <h2>Recent Activity</h2>
                    <button type="button" id="activity-refresh-button" class="edit-button">Refresh</button>
                </div>
                <div id="activity-list" class="activity-list-wrap">
                    <p class="activity-state">Loading activity…</p>
                </div>
            </aside>
        </div>
    </main>

    <div id="task-modal" class="modal-overlay hidden" aria-hidden="true">
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
            <div class="modal-header">
                <h2 id="task-modal-title">Task</h2>
                <button type="button" class="modal-close" id="task-modal-close" aria-label="Close">×</button>
            </div>
            <form id="task-modal-form" class="modal-form">
                <input type="hidden" id="task-id" name="taskId" />
                <div class="form-field">
                    <label for="task-title">Title</label>
                    <input id="task-title" name="title" type="text" />
                    <div id="task-title-error" class="field-error" aria-live="polite"></div>
                </div>
                <div class="form-field">
                    <label for="task-description">Description</label>
                    <textarea id="task-description" name="description"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label for="task-status">Status</label>
                        <select id="task-status" name="status">
                            <option value="ToDo">To Do</option>
                            <option value="InProgress">In Progress</option>
                            <option value="Done">Done</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority" name="priority">
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                </div>
                <div class="form-field">
                    <label for="task-assignee">Assignee</label>
                    <input id="task-assignee" name="assignee" type="text" />
                </div>
                <div id="task-activity-section" class="task-activity-section" hidden>
                    <h3>Activity</h3>
                    <div id="task-activity-list">
                        <p class="activity-state">Loading activity…</p>
                    </div>
                </div>
                <div id="task-form-error" class="form-error" hidden></div>
                <div class="modal-actions">
                    <button type="button" class="cancel-button" id="task-modal-cancel">Cancel</button>
                    <button type="submit" class="submit-button">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8000";
        const STATUS_ORDER = ["ToDo", "InProgress", "Done"];
        const STATUS_LABELS = {
            ToDo: "To Do",
            InProgress: "In Progress",
            Done: "Done"
        };
        const PRIORITY_ORDER = {
            High: 0,
            Medium: 1,
            Low: 2
        };
        const ALLOWED_TRANSITIONS = {
            ToDo: ["InProgress"],
            InProgress: ["Done"],
            Done: ["InProgress"]
        };

        let tasks = [];
        let boardState = "loading";
        let boardFeedback = "";
        let draggedTaskId = null;
        let modalMode = "create";
        let searchDebounceTimer = null;
        const filterState = {
            search: "",
            status: "",
            priority: "",
            assignee: ""
        };
        const board = document.getElementById("board");
        const filterSearch = document.getElementById("filter-search");
        const filterStatus = document.getElementById("filter-status");
        const filterPriority = document.getElementById("filter-priority");
        const filterAssignee = document.getElementById("filter-assignee");
        const filterClearButton = document.getElementById("filter-clear-button");
        const newTaskButton = document.getElementById("new-task-button");
        const taskModal = document.getElementById("task-modal");
        const taskModalDialog = taskModal.querySelector(".modal-dialog");
        const taskModalForm = document.getElementById("task-modal-form");
        const taskModalTitle = document.getElementById("task-title");
        const taskModalDescription = document.getElementById("task-description");
        const taskModalStatus = document.getElementById("task-status");
        const taskModalPriority = document.getElementById("task-priority");
        const taskModalAssignee = document.getElementById("task-assignee");
        const taskModalTaskId = document.getElementById("task-id");
        const taskModalTitleError = document.getElementById("task-title-error");
        const taskModalFormError = document.getElementById("task-form-error");
        const taskModalCloseButton = document.getElementById("task-modal-close");
        const taskModalCancelButton = document.getElementById("task-modal-cancel");
        const activityList = document.getElementById("activity-list");
        const activityRefreshButton = document.getElementById("activity-refresh-button");
        const taskActivitySection = document.getElementById("task-activity-section");
        const taskActivityList = document.getElementById("task-activity-list");

        const ACTIVITY_ACTION_LABELS = {
            created: "Created",
            updated: "Updated",
            deleted: "Deleted",
            status_changed: "Status changed"
        };

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function formatActivityAction(action) {
            return ACTIVITY_ACTION_LABELS[action] || String(action ?? "").replace(/_/g, " ");
        }

        function formatActivityTime(isoString) {
            const date = new Date(isoString);
            if (Number.isNaN(date.getTime())) {
                return isoString || "";
            }

            const now = new Date();
            const diffMs = now - date;
            const diffSec = Math.floor(diffMs / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHour = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHour / 24);

            if (diffSec < 60) {
                return "Just now";
            }
            if (diffMin < 60) {
                return `${diffMin} min ago`;
            }
            if (diffHour < 24) {
                return `${diffHour} hr ago`;
            }
            if (diffDay < 7) {
                return `${diffDay} day${diffDay === 1 ? "" : "s"} ago`;
            }

            return date.toLocaleString(undefined, {
                month: "short",
                day: "numeric",
                year: "numeric",
                hour: "numeric",
                minute: "2-digit"
            });
        }

        function renderActivityMarkup(events) {
            if (!events.length) {
                return '<div class="empty-placeholder">No activity yet.</div>';
            }

            return `
                <ul class="activity-list">
                    ${events.map((event) => `
                        <li class="activity-item">
                            <div class="activity-action">${escapeHtml(formatActivityAction(event.action))}</div>
                            <div class="activity-details">${escapeHtml(event.details || "")}</div>
                            <time class="activity-time" datetime="${escapeHtml(event.timestamp)}">${escapeHtml(formatActivityTime(event.timestamp))}</time>
                        </li>
                    `).join("")}
                </ul>
            `;
        }

        async function fetchActivity() {
            activityList.innerHTML = '<p class="activity-state">Loading activity…</p>';

            try {
                const response = await fetch(`${API_BASE}/activity`);
                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }

                const data = await response.json();
                const events = Array.isArray(data) ? data : [];
                activityList.innerHTML = renderActivityMarkup(events);
            } catch (error) {
                console.error("Failed to load activity", error);
                activityList.innerHTML = '<p class="activity-state-error">Could not load activity.</p>';
            }
        }

        async function fetchTaskActivity(taskId) {
            taskActivityList.innerHTML = '<p class="activity-state">Loading activity…</p>';

            try {
                const response = await fetch(`${API_BASE}/tasks/${taskId}/activity`);
                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }

                const data = await response.json();
                const events = Array.isArray(data) ? data : [];
                taskActivityList.innerHTML = renderActivityMarkup(events);
            } catch (error) {
                console.error("Failed to load task activity", error);
                taskActivityList.innerHTML = '<p class="activity-state-error">Could not load activity.</p>';
            }
        }

        function sortTasks(taskList) {
            return [...taskList].sort((left, right) => {
                const priorityDelta = PRIORITY_ORDER[left.priority] - PRIORITY_ORDER[right.priority];
                if (priorityDelta !== 0) {
                    return priorityDelta;
                }

                return left.id.localeCompare(right.id);
            });
        }

        function getTaskById(taskId) {
            return tasks.find((task) => task.id === taskId);
        }

        function resetTaskForm() {
            taskModalForm.reset();
            taskModalTaskId.value = "";
            taskModalStatus.value = "ToDo";
            taskModalPriority.value = "Medium";
            taskModalTitleError.textContent = "";
            taskModalFormError.textContent = "";
            taskModalFormError.hidden = true;
            taskModalTitle.classList.remove("is-invalid");
        }

        function clearModalErrors() {
            taskModalTitleError.textContent = "";
            taskModalFormError.textContent = "";
            taskModalFormError.hidden = true;
            taskModalTitle.classList.remove("is-invalid");
        }

        function openModal(mode, task = null) {
            modalMode = mode;
            clearModalErrors();
            resetTaskForm();
            taskActivitySection.hidden = true;
            taskActivityList.innerHTML = "";

            if (mode === "edit" && task) {
                document.getElementById("task-modal-title").textContent = "Edit Task";
                taskModalDialog.classList.add("modal-dialog--compact");
                taskModalTaskId.value = task.id;
                taskModalTitle.value = task.title || "";
                taskModalDescription.value = task.description || "";
                taskModalStatus.value = task.status || "ToDo";
                taskModalPriority.value = task.priority || "Medium";
                taskModalAssignee.value = task.assignee || "";
                taskActivitySection.hidden = false;
                fetchTaskActivity(task.id);
            } else {
                document.getElementById("task-modal-title").textContent = "New Task";
                taskModalDialog.classList.remove("modal-dialog--compact");
            }

            taskModal.classList.remove("hidden");
            taskModal.setAttribute("aria-hidden", "false");
            taskModalTitle.focus();
        }

        function closeModal() {
            clearModalErrors();
            resetTaskForm();
            taskActivitySection.hidden = true;
            taskActivityList.innerHTML = "";
            taskModalDialog.classList.remove("modal-dialog--compact");
            taskModal.classList.add("hidden");
            taskModal.setAttribute("aria-hidden", "true");
        }

        function setFeedback(message) {
            boardFeedback = message;
        }

        function clearFeedback() {
            boardFeedback = "";
        }

        function isAllowedTransition(currentStatus, targetStatus) {
            return ALLOWED_TRANSITIONS[currentStatus]?.includes(targetStatus) ?? false;
        }

        function attachBoardListeners() {
            board.querySelectorAll(".task-card").forEach((card) => {
                card.addEventListener("dragstart", handleDragStart);
                card.addEventListener("dragend", handleDragEnd);
            });

            board.querySelectorAll(".board-column").forEach((column) => {
                column.addEventListener("dragover", handleDragOver);
                column.addEventListener("dragleave", handleDragLeave);
                column.addEventListener("drop", handleDrop);
            });

            board.querySelectorAll(".edit-button").forEach((button) => {
                button.addEventListener("click", (event) => {
                    const card = event.currentTarget.closest(".task-card");
                    if (!card) {
                        return;
                    }
                    const task = getTaskById(card.dataset.taskId);
                    if (task) {
                        openModal("edit", task);
                    }
                });
            });
        }

        function renderBoard(taskList, state = boardState) {
            const groupedTasks = STATUS_ORDER.reduce((accumulator, status) => {
                accumulator[status] = sortTasks(taskList.filter((task) => task.status === status));
                return accumulator;
            }, {});

            const stateMarkup = state === "loading"
                ? '<div class="board-state board-state-loading"><strong>Loading tasks…</strong><p>Please wait while the latest tasks are loaded.</p></div>'
                : state === "empty"
                    ? '<div class="board-state board-state-empty"><strong>No tasks yet.</strong><p>New tasks will appear here once they are added.</p></div>'
                    : state === "error"
                        ? '<div class="board-state board-state-error"><strong>We could not load tasks.</strong><p>Please try again in a moment.</p><button type="button" class="retry-button">Retry</button></div>'
                        : "";

            const feedbackMarkup = boardFeedback
                ? `<div class="board-feedback" role="alert">${escapeHtml(boardFeedback)}</div>`
                : "";

            const columnsMarkup = STATUS_ORDER.map((status) => {
                const columnTasks = groupedTasks[status];
                const cardsMarkup = state === "loading"
                    ? '<div class="empty-placeholder">Loading…</div>'
                    : columnTasks.length
                        ? columnTasks.map((task) => {
                            const priorityClass = (task.priority || "Medium").toLowerCase();
                            const assigneeLabel = task.assignee || "Unassigned";
                            const title = escapeHtml(task.title);
                            const description = escapeHtml(task.description || "");

                            return `
                                <article class="task-card" draggable="true" data-status="${status}" data-task-id="${escapeHtml(task.id)}">
                                    <h3>${title}</h3>
                                    ${description ? `<p>${description}</p>` : ""}
                                    <div class="task-footer">
                                        <span class="priority-pill ${priorityClass}">${escapeHtml(task.priority || "Medium")}</span>
                                        <span>${escapeHtml(assigneeLabel)}</span>
                                        <button type="button" class="edit-button">Edit</button>
                                    </div>
                                </article>
                            `;
                        }).join("")
                        : '<div class="empty-placeholder">No tasks yet.</div>';

                return `
                    <section class="board-column" data-status="${status}">
                        <div class="column-header">
                            <h2>${escapeHtml(STATUS_LABELS[status])}</h2>
                            <span class="column-count">${columnTasks.length}</span>
                        </div>
                        ${cardsMarkup}
                    </section>
                `;
            }).join("");

            board.innerHTML = `${stateMarkup}${feedbackMarkup}${columnsMarkup}`;
            attachBoardListeners();

            if (state === "error") {
                const retryButton = document.querySelector(".retry-button");
                if (retryButton) {
                    retryButton.addEventListener("click", fetchTasks);
                }
            }
        }

        function handleDragStart(event) {
            const taskId = event.currentTarget.dataset.taskId;
            const task = getTaskById(taskId);

            if (!task) {
                return;
            }

            draggedTaskId = taskId;
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", taskId);
            event.currentTarget.classList.add("is-dragging");
        }

        function handleDragEnd(event) {
            event.currentTarget.classList.remove("is-dragging");
            board.querySelectorAll(".board-column").forEach((column) => {
                column.classList.remove("drag-over");
            });
            draggedTaskId = null;
        }

        function handleDragOver(event) {
            if (!draggedTaskId) {
                return;
            }

            event.preventDefault();
            event.currentTarget.classList.add("drag-over");
        }

        function handleDragLeave(event) {
            if (event.currentTarget.contains(event.relatedTarget)) {
                return;
            }

            event.currentTarget.classList.remove("drag-over");
        }

        async function updateTaskStatus(taskId, targetStatus, previousStatus) {
            const optimisticTasks = tasks.map((task) => task.id === taskId ? { ...task, status: targetStatus } : task);
            tasks = optimisticTasks;
            clearFeedback();
            renderBoard(tasks, boardState);

            try {
                const response = await fetch(`${API_BASE}/tasks/${taskId}`, {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ status: targetStatus })
                });

                if (!response.ok) {
                    const errorMessage = await parseErrorMessage(response);
                    tasks = tasks.map((task) => task.id === taskId ? { ...task, status: previousStatus } : task);
                    setFeedback(errorMessage || "The task could not be moved. Please try again.");
                    renderBoard(tasks, boardState);
                    return;
                }

                clearFeedback();
                renderBoard(tasks, boardState);
                fetchActivity();
            } catch (error) {
                tasks = tasks.map((task) => task.id === taskId ? { ...task, status: previousStatus } : task);
                setFeedback("The task could not be moved because the server is unavailable. Please try again.");
                renderBoard(tasks, boardState);
            }
        }

        async function parseErrorMessage(response) {
            try {
                const data = await response.json();
                if (typeof data.detail === "string") {
                    return data.detail;
                }
                if (Array.isArray(data.detail)) {
                    return data.detail.map((item) => item.msg || item.loc?.join(".")).filter(Boolean).join("; ");
                }
                if (data.detail && typeof data.detail === "object") {
                    return data.detail.message || data.detail.error || "The server rejected the request.";
                }
                if (data.message) {
                    return data.message;
                }
            } catch (error) {
                console.error("Failed to parse error payload", error);
            }

            return `The server rejected the request (${response.status}).`;
        }

        async function handleTaskSubmit(event) {
            event.preventDefault();
            clearModalErrors();

            const title = taskModalTitle.value.trim();
            if (!title) {
                taskModalTitle.classList.add("is-invalid");
                taskModalTitleError.textContent = "Title is required";
                return;
            }

            const payload = {
                title,
                description: taskModalDescription.value || "",
                status: taskModalStatus.value,
                priority: taskModalPriority.value,
                assignee: taskModalAssignee.value.trim() ? taskModalAssignee.value.trim() : null
            };

            const method = modalMode === "edit" ? "PATCH" : "POST";
            const url = modalMode === "edit"
                ? `${API_BASE}/tasks/${taskModalTaskId.value}`
                : `${API_BASE}/tasks`;

            try {
                const response = await fetch(url, {
                    method,
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorMessage = await parseErrorMessage(response);
                    taskModalFormError.textContent = errorMessage;
                    taskModalFormError.hidden = false;
                    return;
                }

                closeModal();
                clearFeedback();
                await fetchTasks();
            } catch (error) {
                taskModalFormError.textContent = "Unable to save the task. Please try again.";
                taskModalFormError.hidden = false;
            }
        }

        async function handleDrop(event) {
            event.preventDefault();
            const targetStatus = event.currentTarget.dataset.status;
            const task = getTaskById(draggedTaskId);

            board.querySelectorAll(".board-column").forEach((column) => {
                column.classList.remove("drag-over");
            });

            if (!task || task.status === targetStatus) {
                draggedTaskId = null;
                return;
            }

            if (!isAllowedTransition(task.status, targetStatus)) {
                setFeedback(`Cannot move a task from ${STATUS_LABELS[task.status] || task.status} to ${STATUS_LABELS[targetStatus] || targetStatus}.`);
                renderBoard(tasks, boardState);
                draggedTaskId = null;
                return;
            }

            const previousStatus = task.status;
            await updateTaskStatus(task.id, targetStatus, previousStatus);
            draggedTaskId = null;
        }

        function hasActiveFilters() {
            return Boolean(
                filterState.search.trim()
                || filterState.status
                || filterState.priority
                || filterState.assignee.trim()
            );
        }

        function syncFilterControls() {
            filterSearch.value = filterState.search;
            filterStatus.value = filterState.status;
            filterPriority.value = filterState.priority;
            filterAssignee.value = filterState.assignee;
            filterClearButton.disabled = !hasActiveFilters();
        }

        function buildTaskQueryParams() {
            const params = new URLSearchParams();
            const search = filterState.search.trim();
            const assignee = filterState.assignee.trim();

            if (search) {
                params.set("search", search);
            }
            if (filterState.status) {
                params.set("status", filterState.status);
            }
            if (filterState.priority) {
                params.set("priority", filterState.priority);
            }
            if (assignee) {
                params.set("assignee", assignee);
            }

            return params;
        }

        function readFilterStateFromControls() {
            filterState.search = filterSearch.value;
            filterState.status = filterStatus.value;
            filterState.priority = filterPriority.value;
            filterState.assignee = filterAssignee.value;
            syncFilterControls();
        }

        function clearFilters() {
            if (searchDebounceTimer) {
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = null;
            }
            filterState.search = "";
            filterState.status = "";
            filterState.priority = "";
            filterState.assignee = "";
            syncFilterControls();
            fetchTasks();
        }

        function scheduleFilterFetch() {
            readFilterStateFromControls();
            if (searchDebounceTimer) {
                clearTimeout(searchDebounceTimer);
            }
            searchDebounceTimer = setTimeout(() => {
                searchDebounceTimer = null;
                fetchTasks();
            }, 300);
        }

        function attachFilterListeners() {
            filterSearch.addEventListener("input", scheduleFilterFetch);
            filterStatus.addEventListener("change", () => {
                readFilterStateFromControls();
                fetchTasks();
            });
            filterPriority.addEventListener("change", () => {
                readFilterStateFromControls();
                fetchTasks();
            });
            filterAssignee.addEventListener("input", scheduleFilterFetch);
            filterClearButton.addEventListener("click", clearFilters);
        }

        function attachModalListeners() {
            newTaskButton.addEventListener("click", () => openModal("create"));
            activityRefreshButton.addEventListener("click", fetchActivity);
            taskModalCloseButton.addEventListener("click", closeModal);
            taskModalCancelButton.addEventListener("click", closeModal);
            taskModalForm.addEventListener("submit", handleTaskSubmit);
            taskModal.addEventListener("click", (event) => {
                if (event.target === taskModal) {
                    closeModal();
                }
            });
            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape" && !taskModal.classList.contains("hidden")) {
                    closeModal();
                }
            });
        }

        async function fetchTasks() {
            boardState = "loading";
            clearFeedback();
            renderBoard([], boardState);

            try {
                const params = buildTaskQueryParams();
                const query = params.toString();
                const url = query ? `${API_BASE}/tasks?${query}` : `${API_BASE}/tasks`;
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }

                const data = await response.json();
                tasks = Array.isArray(data) ? data : [];
                boardState = tasks.length === 0 && !hasActiveFilters() ? "empty" : "ready";
                renderBoard(tasks, boardState);
                fetchActivity();
            } catch (error) {
                console.error("Failed to load tasks", error);
                tasks = [];
                boardState = "error";
                renderBoard(tasks, boardState);
            }
        }

        attachModalListeners();
        attachFilterListeners();
        syncFilterControls();
        fetchTasks();
        fetchActivity();
    </script>
</body>
</html>
